# Builds and verifies CausVane on Linux, Windows and macOS: the portable app and the installer for each,
# attached to a release when one is published.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Every job gets a read-only token unless it asks for more.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests
        run: mvn -B clean package

      # 1. The portable apps: unpack and run, nothing to install
      - name: Portable app (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh packaging/build-app.sh

      - name: Portable app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build-app.bat

      - name: Pack the portable apps
        shell: bash
        run: |
          mkdir -p release
          case "$RUNNER_OS" in
            macOS)   test -x dist/CausVane.app/Contents/MacOS/CausVane
                     ditto -c -k --keepParent dist/CausVane.app release/CausVane-macOS.zip ;;
            Linux)   test -x dist/CausVane/bin/CausVane
                     tar -czf release/CausVane-Linux.tar.gz -C dist CausVane ;;
            Windows) test -f dist/CausVane/CausVane.exe
                     pwsh -NoProfile -Command "Compress-Archive -Path dist/CausVane -DestinationPath release/CausVane-Windows-Portable.zip" ;;
          esac

      # 2. The installers, like other desktop applications: a setup program on Windows, a disk image on
      #    macOS, and packages for the Linux software installers
      - name: Installer tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm fakeroot

      - name: Installer tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin" -Directory | Select-Object -First 1
            "$($wix.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        run: |
          sh packaging/build-app.sh dmg
          mv dist/CausVane-*.dmg release/CausVane-macOS.dmg

      - name: Installers (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/build-app.sh deb
          sh packaging/build-app.sh rpm
          mv dist/causvane_*.deb release/CausVane-Linux.deb
          mv dist/causvane-*.rpm release/CausVane-Linux.rpm

      - name: Installers (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call packaging\build-app.bat exe || exit /b 1
          for %%f in (dist\CausVane-*.exe) do move "%%f" release\CausVane-Windows-Setup.exe

      - name: Everything was built
        run: ls -l release && test "$(ls release | wc -l)" -ge 2

      - name: Keep the downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}
          path: release/

  # Attaches the downloads to the published release after all three systems pass.
  release:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "CausVane $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
          fi
