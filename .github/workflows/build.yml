# Builds and verifies LogReader on Linux, Windows and macOS, and attaches the native app for each.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests, fat JAR
        run: mvn -B clean package

      - name: CLI analyzes every sample
        run: |
          for f in samples/*.log; do
            java -jar target/LogReader.jar analyze "$f" --no-color --top 1
          done

      - name: GUI self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a java -jar target/LogReader.jar self-test samples/java-spring-app.log

      - name: GUI self-test
        if: runner.os != 'Linux'
        run: java -jar target/LogReader.jar self-test samples/java-spring-app.log

      - name: Native app (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh packaging/build-app.sh

      - name: Native app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build-app.bat

      - name: Native app runs (macOS)
        if: runner.os == 'macOS'
        run: dist/LogReader.app/Contents/MacOS/LogReader analyze samples/node-express.log --no-color --top 1

      - name: Native app runs (Linux)
        if: runner.os == 'Linux'
        run: dist/LogReader/bin/LogReader analyze samples/node-express.log --no-color --top 1

      - name: Native app runs (Windows)
        if: runner.os == 'Windows'
        run: dist/LogReader/LogReaderCLI.exe analyze samples/node-express.log --no-color --top 1

      - uses: actions/upload-artifact@v4
        with:
          name: LogReader-${{ runner.os }}
          path: |
            target/LogReader.jar
            dist/

      # The steps below run only when a version tag such as v1.0.0 is pushed.
      - name: Package for release (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --keepParent dist/LogReader.app release/LogReader-macOS.zip
          cp target/LogReader.jar release/

      - name: Package for release (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf release/LogReader-Linux.tar.gz -C dist LogReader

      - name: Package for release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive -Path dist/LogReader -DestinationPath release/LogReader-Windows.zip

      - name: Keep release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/

  # Publishes a GitHub Release with the downloads after all three systems pass.
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LogReader $GITHUB_REF_NAME" \
            --notes "Downloads:
          - **LogReader-macOS.zip**: the macOS app. Unzip it and move LogReader to Applications. The first time, right-click the app and choose Open, because it isn't signed by Apple.
          - **LogReader-Windows.zip**: the Windows app. Unzip it and run LogReader.exe inside the LogReader folder.
          - **LogReader-Linux.tar.gz**: the Linux app. Extract it and run LogReader/bin/LogReader.
          - **LogReader.jar**: works on any system with Java 21 or newer: java -jar LogReader.jar

          The three native apps include Java, so nothing else needs to be installed."
