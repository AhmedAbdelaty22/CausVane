# Builds and verifies LogReader on Linux, Windows and macOS, and attaches the native app for each.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests, fat JAR
        run: mvn -B clean package

      - name: CLI analyzes every sample
        run: |
          for f in samples/*.log; do
            java -jar target/LogReader.jar analyze "$f" --no-color --top 1
          done

      - name: GUI self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a java -jar target/LogReader.jar self-test samples/java-spring-app.log

      - name: GUI self-test
        if: runner.os != 'Linux'
        run: java -jar target/LogReader.jar self-test samples/java-spring-app.log

      - name: Native app (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh packaging/build-app.sh

      - name: Native app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build-app.bat

      - name: Native app runs (macOS)
        if: runner.os == 'macOS'
        run: dist/LogReader.app/Contents/MacOS/LogReader analyze samples/node-express.log --no-color --top 1

      - name: Native app runs (Linux)
        if: runner.os == 'Linux'
        run: dist/LogReader/bin/LogReader analyze samples/node-express.log --no-color --top 1

      - name: Native app runs (Windows)
        if: runner.os == 'Windows'
        run: dist/LogReader/LogReaderCLI.exe analyze samples/node-express.log --no-color --top 1

      - uses: actions/upload-artifact@v4
        with:
          name: LogReader-${{ runner.os }}
          path: |
            target/LogReader.jar
            dist/
