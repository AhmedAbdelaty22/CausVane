# Builds and verifies LogReader on Linux, Windows and macOS, and attaches the native app for each.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Every job gets a read-only token unless it asks for more.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests, fat JAR
        run: mvn -B clean package

      - name: CLI analyzes every sample
        run: |
          for f in samples/*.log; do
            java -jar target/LogReader.jar analyze "$f" --no-color --top 1
          done

      - name: GUI self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a java -jar target/LogReader.jar self-test samples/checkout-db-failover.log

      - name: GUI self-test
        if: runner.os != 'Linux'
        run: java -jar target/LogReader.jar self-test samples/checkout-db-failover.log

      - name: Native app (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh packaging/build-app.sh

      - name: Native app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build-app.bat

      - name: Native app runs (macOS)
        if: runner.os == 'macOS'
        run: dist/LogReader.app/Contents/MacOS/LogReader analyze samples/api-gateway-cert-expiry.log --no-color --top 1

      - name: Native app runs (Linux)
        if: runner.os == 'Linux'
        run: dist/LogReader/bin/LogReader analyze samples/api-gateway-cert-expiry.log --no-color --top 1

      - name: Native app runs (Windows)
        if: runner.os == 'Windows'
        run: dist/LogReader/LogReaderCLI.exe analyze samples/api-gateway-cert-expiry.log --no-color --top 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LogReader-${{ runner.os }}
          path: |
            target/LogReader.jar
            dist/

      # The steps below run only when a release is published on GitHub.
      - name: Package for release (macOS)
        if: github.event_name == 'release' && runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --keepParent dist/LogReader.app release/LogReader-macOS.zip
          cp target/LogReader.jar release/

      - name: Package for release (Linux)
        if: github.event_name == 'release' && runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf release/LogReader-Linux.tar.gz -C dist LogReader

      - name: Package for release (Windows)
        if: github.event_name == 'release' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive -Path dist/LogReader -DestinationPath release/LogReader-Windows.zip

      - name: Keep release files
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}
          path: release/

  # Attaches the downloads to the published release after all three systems pass.
  release:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "LogReader $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
          fi
