# Builds and verifies CausVane on Linux, Windows and macOS, and attaches the native app for each.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Every job gets a read-only token unless it asks for more.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests
        run: mvn -B clean package

      - name: Native app (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh packaging/build-app.sh

      - name: Native app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build-app.bat

      - name: Native app was built
        run: |
          case "$RUNNER_OS" in
            macOS)   test -x dist/CausVane.app/Contents/MacOS/CausVane ;;
            Linux)   test -x dist/CausVane/bin/CausVane ;;
            Windows) test -f dist/CausVane/CausVane.exe ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CausVane-${{ runner.os }}
          path: dist/

      # The steps below run only when a release is published on GitHub.
      - name: Package for release (macOS)
        if: github.event_name == 'release' && runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --keepParent dist/CausVane.app release/CausVane-macOS.zip

      - name: Package for release (Linux)
        if: github.event_name == 'release' && runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf release/CausVane-Linux.tar.gz -C dist CausVane

      - name: Package for release (Windows)
        if: github.event_name == 'release' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive -Path dist/CausVane -DestinationPath release/CausVane-Windows.zip

      - name: Keep release files
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}
          path: release/

  # Attaches the downloads to the published release after all three systems pass.
  release:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "CausVane $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
          fi
